<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HPX EIGEN CRM — Tenant-isolated CRM platform for Indian consulting firms" />
    <meta name="theme-color" content="#0a0e27" />
    <title>HPX EIGEN CRM</title>
    <!-- Anti-flicker: apply saved theme before first paint -->
    <script>
      (function(){try{var t=localStorage.getItem('hpx:theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}else{document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
